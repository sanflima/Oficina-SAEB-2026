<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{background:#fff;padding:20px;font-family:var(--font-sans);}
.row{display:flex;gap:8px;margin-bottom:8px;}
.swatch{flex:1;height:56px;border-radius:10px;position:relative;display:flex;align-items:flex-end;padding:6px 8px;}
.swatch span{font-size:10px;font-weight:600;color:rgba(255,255,255,0.9);text-shadow:0 1px 2px rgba(0,0,0,0.3);}
.swatch.light span{color:rgba(0,0,0,0.5);}
.label{font-size:11px;font-weight:600;color:#64748b;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;}
</style></head><body>
<div class="label">Blue — Primary</div>
<div class="row">
  <div class="swatch light" style="background:#eff6ff"><span>50</span></div>
  <div class="swatch light" style="background:#dbeafe"><span>100</span></div>
  <div class="swatch light" style="background:#bfdbfe"><span>200</span></div>
  <div class="swatch" style="background:#60a5fa"><span>400</span></div>
  <div class="swatch" style="background:#3b82f6"><span>500</span></div>
  <div class="swatch" style="background:#2563eb"><span>600 ★</span></div>
  <div class="swatch" style="background:#1d4ed8"><span>700</span></div>
  <div class="swatch" style="background:#1e40af"><span>800</span></div>
</div>
<div class="label" style="margin-top:12px">Navy — Dark Sections</div>
<div class="row">
  <div class="swatch" style="background:#2e4080"><span>600</span></div>
  <div class="swatch" style="background:#243566"><span>700</span></div>
  <div class="swatch" style="background:#1a2a50"><span>800</span></div>
  <div class="swatch" style="background:#0d1b3e"><span>900 ★</span></div>
</div>
</body></html>
