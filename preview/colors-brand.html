<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{background:#fff;padding:20px;font-family:var(--font-sans);}
.row{display:flex;gap:8px;margin-bottom:8px;}
.swatch{flex:1;height:56px;border-radius:10px;display:flex;align-items:flex-end;padding:6px 8px;}
.swatch span{font-size:10px;font-weight:600;color:rgba(255,255,255,0.9);text-shadow:0 1px 2px rgba(0,0,0,0.2);}
.swatch.light span{color:rgba(0,0,0,0.5);}
.label{font-size:11px;font-weight:600;color:#64748b;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;}
</style></head><body>
<div class="label">PROFMAT Teal</div>
<div class="row">
  <div class="swatch light" style="background:#d0f4f7"><span>100</span></div>
  <div class="swatch" style="background:#2bb5c0"><span>400</span></div>
  <div class="swatch" style="background:#1a9ea8"><span>500 ★</span></div>
  <div class="swatch" style="background:#147d88"><span>600</span></div>
</div>
<div class="label" style="margin-top:12px">UNIVASF Gold</div>
<div class="row">
  <div class="swatch light" style="background:#fde68a"><span>300</span></div>
  <div class="swatch" style="background:#fbbf24"><span>400</span></div>
  <div class="swatch" style="background:#f59e0b"><span>500 ★</span></div>
</div>
</body></html>
