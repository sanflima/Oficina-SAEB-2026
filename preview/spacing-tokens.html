<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{background:#f8fafc;padding:20px;font-family:var(--font-sans);}
.grid{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;}
.box{background:#2563eb;opacity:0.85;}
.label{font-size:9px;color:#94a3b8;font-weight:600;text-align:center;}
.section{margin-bottom:16px;}
.title{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.radii{display:flex;gap:12px;flex-wrap:wrap;}
.r{width:40px;height:40px;background:#2563eb;opacity:0.8;}
</style></head><body>
<div class="section">
  <div class="title">Spacing Scale</div>
  <div class="grid">
    <div class="item"><div class="box" style="width:4px;height:16px"></div><div class="label">4</div></div>
    <div class="item"><div class="box" style="width:8px;height:16px"></div><div class="label">8</div></div>
    <div class="item"><div class="box" style="width:12px;height:16px"></div><div class="label">12</div></div>
    <div class="item"><div class="box" style="width:16px;height:16px"></div><div class="label">16</div></div>
    <div class="item"><div class="box" style="width:24px;height:16px"></div><div class="label">24</div></div>
    <div class="item"><div class="box" style="width:32px;height:16px"></div><div class="label">32</div></div>
    <div class="item"><div class="box" style="width:48px;height:16px"></div><div class="label">48</div></div>
    <div class="item"><div class="box" style="width:64px;height:16px"></div><div class="label">64</div></div>
    <div class="item"><div class="box" style="width:80px;height:16px"></div><div class="label">80</div></div>
    <div class="item"><div class="box" style="width:96px;height:16px"></div><div class="label">96</div></div>
  </div>
</div>
<div class="section">
  <div class="title">Border Radii</div>
  <div class="radii">
    <div class="item"><div class="r" style="border-radius:6px"></div><div class="label">sm 6px</div></div>
    <div class="item"><div class="r" style="border-radius:12px"></div><div class="label">md 12px</div></div>
    <div class="item"><div class="r" style="border-radius:16px"></div><div class="label">lg 16px</div></div>
    <div class="item"><div class="r" style="border-radius:24px"></div><div class="label">xl 24px</div></div>
    <div class="item"><div class="r" style="border-radius:999px;width:60px;height:32px"></div><div class="label">pill</div></div>
  </div>
</div>
</body></html>
