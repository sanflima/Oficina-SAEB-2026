<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{background:#fff;padding:20px;font-family:var(--font-sans);}
.row{display:flex;gap:8px;}
.swatch{flex:1;height:48px;border-radius:10px;display:flex;align-items:flex-end;padding:5px 7px;border:1px solid rgba(0,0,0,0.06);}
.swatch span{font-size:10px;font-weight:600;color:rgba(0,0,0,0.4);}
.swatch.dk span{color:rgba(255,255,255,0.7);}
.label{font-size:11px;font-weight:600;color:#64748b;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;}
</style></head><body>
<div class="label">Neutrals / Grays</div>
<div class="row">
  <div class="swatch" style="background:#f8fafc"><span>50</span></div>
  <div class="swatch" style="background:#f1f5f9"><span>100</span></div>
  <div class="swatch" style="background:#e2e8f0"><span>200</span></div>
  <div class="swatch" style="background:#cbd5e1"><span>300</span></div>
  <div class="swatch" style="background:#94a3b8"><span>400</span></div>
  <div class="swatch dk" style="background:#64748b"><span>500</span></div>
  <div class="swatch dk" style="background:#475569"><span>600</span></div>
  <div class="swatch dk" style="background:#334155"><span>700</span></div>
  <div class="swatch dk" style="background:#1e293b"><span>800</span></div>
  <div class="swatch dk" style="background:#0f172a"><span>900</span></div>
</div>
</body></html>
