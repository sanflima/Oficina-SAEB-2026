<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{background:#f8fafc;padding:20px;font-family:var(--font-sans);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.tag{display:inline-flex;align-items:center;gap:6px;background:#dbeafe;color:#2563eb;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;}
.tag::before{content:'●';font-size:7px;}
.tag-teal{background:#d0f4f7;color:#147d88;}
.tag-teal::before{content:'●';}
.chip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid #e2e8f0;border-radius:999px;padding:5px 14px;font-size:12px;font-weight:600;color:#334155;}
.chip::before{content:'✓';color:#2563eb;font-size:10px;}
.badge{background:#2563eb;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;}
.badge-teal{background:#1a9ea8;}
.badge-gold{background:#f59e0b;}
</style></head><body>
<div class="tag">Oficina SAEB 2025</div>
<div class="tag tag-teal">PROFMAT</div>
<div class="chip">Inscrições abertas</div>
<div class="chip">Certificado incluso</div>
<span class="badge">Novo</span>
<span class="badge badge-teal">Gratuito</span>
<span class="badge badge-gold">Destaque</span>
</body></html>
