<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{background:#0d1b3e;padding:20px;font-family:var(--font-sans);}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.card{background:#1a2a50;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:20px;}
.icon-box{width:44px;height:44px;background:#2563eb;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:20px;}
h3{font-size:.95rem;font-weight:700;color:#fff;margin-bottom:4px;}
p{font-size:.8rem;color:rgba(255,255,255,0.6);line-height:1.5;}
</style></head><body>
<div class="grid">
  <div class="card"><div class="icon-box">🔍</div><h3>Análise de Perfil</h3><p>Reunião inicial para entender seu contexto</p></div>
  <div class="card"><div class="icon-box" style="background:#1a9ea8">📐</div><h3>Matrizes</h3><p>Estudo das competências avaliadas pelo SAEB</p></div>
  <div class="card"><div class="icon-box" style="background:#1d4ed8">📋</div><h3>Aplicação Prática</h3><p>Exercícios e atividades com foco no exame</p></div>
</div>
</body></html>
