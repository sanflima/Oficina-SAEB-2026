<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{background:#fff;padding:24px 28px;font-family:var(--font-sans);}
.tag{display:inline-flex;align-items:center;gap:6px;background:#dbeafe;color:#2563eb;font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;margin-bottom:12px;}
.tag::before{content:'●';font-size:8px;}
h1{font-size:2.5rem;font-weight:800;line-height:1.2;color:#0f172a;margin-bottom:8px;}
h1 span{color:#2563eb;}
p{font-size:1rem;color:#475569;line-height:1.6;max-width:480px;}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.chip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid #e2e8f0;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600;color:#334155;}
.chip::before{content:'✓';color:#2563eb;font-size:11px;}
</style></head><body>
<div class="tag">● Oficina SAEB 2025</div>
<h1>Aprenda a <span>interpretar</span> os resultados do SAEB</h1>
<p>Formação prática para professores de matemática do ensino básico, com foco em análise de desempenho e estratégias pedagógicas.</p>
<div class="chips">
  <div class="chip">Análise de dados</div>
  <div class="chip">Matrizes de referência</div>
  <div class="chip">Práticas pedagógicas</div>
</div>
</body></html>
